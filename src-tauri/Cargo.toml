[package]
name = "dagent"
version = "0.1.0"
description = "A local desktop AI agent"
authors = ["Dagent contributors"]
edition = "2021"

[lib]
name = "dagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
meval = "0.2"

# Favor compile speed for CI-produced binaries. Runtime optimization and
# binary size are intentionally secondary for this application.
[profile.release]
opt-level = 0
debug = 0
lto = false
codegen-units = 256
incremental = true
panic = "abort"

[profile.dev]
debug = 0
incremental = true
